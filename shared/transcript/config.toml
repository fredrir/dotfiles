vault = "~/Documents/main"
projects = [
    "dotfiles",
    "distro-lab",
    "ArchTeX",
    "llunde-infra",
    "llunde-backend",
    "llunde-frontend",
    "llunde-pyparser",
    "sndbx",
    "rif",
    "Elvfast",
]

min_rounds = 1

nested_groups = ["llunde"]

[aliases]
"llunde-new/infra" = "llunde-infra"
"llunde-new/backend" = "llunde-backend"
"llunde-new/frontend" = "llunde-frontend"
"llunde-new/pyparser" = "llunde-pyparser"

[groups]
llunde = [
    "llunde-infra",
    "llunde-backend",
    "llunde-frontend",
    "llunde-pyparser",
]
other = ["sndbx"]
dotfiles = ["dotfiles"]
distro-lab = ["distro-lab"]
rif = ["rif"]
elvfast = ["Elvfast"]
# Replace Transcripts/<group> 
# Relative to the vault root.
[destinations]
dotfiles = "Dotfiles/Agents"
distro-lab = "Dotfiles/Distro Lab/Agents"
ArchTeX = "ArchTeX/Agents"
llunde = "llunde/Agents"
rif = "rif/Agents"
elvfast = "Projects/Elvfast/Agents"
