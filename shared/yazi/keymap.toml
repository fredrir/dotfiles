#:schema https://yazi-rs.github.io/schemas/keymap.json

# Keep only local overrides here; all other bindings are inherited from Yazi.

[[mgr.prepend_keymap]]
on   = "<Esc>"
run  = "plugin lua.smart-esc"
desc = "Cancel visual mode, selection, filter, find or search, otherwise quit"

[[mgr.prepend_keymap]]
on   = ["g", "p"]
run  = "cd ~/projects"
desc = "Go to ~/projects"

[[mgr.prepend_keymap]]
on   = ["g", "a"]
run  = "cd ~/dotfiles"
desc = "Go to ~/dotfiles"

[[mgr.prepend_keymap]]
on   = ["g", "d"]
run  = "cd ~/Documents"
desc = "Go to ~/Documents"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"
