#:schema https://yazi-rs.github.io/schemas/yazi.json

# Keep only local overrides here; all other settings, including trash handlers,
# are inherited from Yazi's shipped configuration.

[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", for = "unix", block = true },
  { run = "code %s", desc = "code", for = "windows", orphan = true },
  { run = "code -w %s", desc = "code (block)", for = "windows", block = true },
]

[tasks]
file_workers     = 3
plugin_workers   = 5
fetch_workers    = 5
preload_workers  = 2
process_workers  = 5
bizarre_retry    = 3
image_alloc      = 536870912 # 512MB
image_bound      = [10000, 10000]
suppress_preload = false

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
