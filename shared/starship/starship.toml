add_newline = false
palette     = 'theme'

format = '$python$git_branch$directory$character'

right_format = '$cmd_duration'

[python]
format            = '[\(.venv\)](prompt_python)$git_branch$directory$character'
symbol            = ''
style             = 'prompt_python'
detect_extensions = []
detect_files      = []
detect_folders    = []

[git_branch]
format = '[\[$branch\]]($style)'
style  = 'prompt_git'

[directory]
format            = '[\[$path\]]($style)'
style             = 'prompt_dir'
truncation_length = 8
truncate_to_repo  = false

[cmd_duration]
min_time = 2000
format   = 'took [$duration]($style)'
style    = 'prompt_duration'

[character]
success_symbol = '[\$](prompt_char)'
error_symbol   = '[\$](prompt_char)'

