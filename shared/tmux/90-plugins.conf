# Provision with dotfile sync or tmux-workspace plugins install.
set -g @fingers-enable-bindings 0
set -g @fingers-use-system-clipboard 0
set -g @fingers-show-copied-notification 0
set -g @fingers-keyboard-layout qwerty-homerow
set -g @fingers-main-action 'tmux load-buffer -w -'
set -g @fingers-ctrl-action 'tmux load-buffer -w -'
# Indexed hint colors come from theme.conf.

set -g @resurrect-never-overwrite on
set -g @resurrect-default-processes 'vim nvim man less'
set -g @resurrect-capture-pane-contents on
set -g @resurrect-pane-contents-area visible

run-shell -b '"#{@workspace_config}/bin/tmux-workspace" plugins load >/dev/null 2>&1 || :'
