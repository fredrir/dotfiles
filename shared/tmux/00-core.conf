##### Terminal ###############################################################

# Prefer tmux's richer terminfo definition when the host has it.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' {
    set -g default-terminal "tmux-256color"
}

# Forward focus changes to applications such as Vim/Neovim.
set -g focus-events on

# Responsive Escape without making Meta/Alt unreliable.
set -s escape-time 10

##### Behaviour ##############################################################

set -g mouse on
set -g history-limit 100000

# Number windows/panes from 1.
set -g base-index 1
setw -g pane-base-index 1

# Close window 2 -> 3 becomes 2, etc.
set -g renumber-windows on

# Keep the client alive when another tmux session exists.
set -g detach-on-destroy off

# Let tmux copy to the outside terminal, but don't let arbitrary applications
# inside panes manipulate tmux's clipboard buffers.
set -s set-clipboard external

##### Titles #################################################################

set -g set-titles on
set -g set-titles-string '#S:#I:#W'
