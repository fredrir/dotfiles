# Terminal capabilities. Fixed array slots make repeated reloads idempotent.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' {
    set -g default-terminal tmux-256color
} {
    set -g default-terminal screen-256color
}
set -s terminal-features[80] 'xterm-256color:RGB:usstyle:clipboard'
set -s terminal-features[81] 'wezterm:RGB:usstyle:extkeys:clipboard'
set -s terminal-features[82] 'tmux*:RGB:usstyle:extkeys:clipboard'
set -g allow-passthrough on
set -g focus-events on
set -s escape-time 10
set -s extended-keys always
%if #{>=:#{version},3.5}
set -s extended-keys-format csi-u
%endif

# These are explicit WezTerm/ZLE contracts, independent of application mode.
set -s user-keys[0] "\e[13;2u"
set -s user-keys[1] "\e[5;30012~"
bind -n -N 'Pass Shift+Enter to the shell or application' User0 send-keys -l "\e[13;2u"
# Decode the reserved wire key, then inject the existing ZLE widget sequence
# literally. Existing shells keep working when only tmux/WezTerm are reloaded.
bind -n -N 'Pass the Yazi shell widget sequence' User1 send-keys -l "\e[115;9u"

# OSC 52 copies travel to the attached terminal, including over SSH. Clipboard
# reads are supported natively from 3.7; older versions still copy and paste.
set -s set-clipboard on
%if #{>=:#{version},3.7}
set -s get-clipboard both
%endif

set -g prefix C-b
set -g prefix2 None
set -g mouse on
set -g history-limit 100000
set -g display-time 2500
set -g display-panes-time 1500
set -g repeat-time 300
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize off
setw -g window-size latest
set -g detach-on-destroy no-detached
set -g destroy-unattached off
setw -g automatic-rename on
setw -g allow-rename off
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'
setw -g monitor-activity off
setw -g monitor-silence 0
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
set -g set-titles on
set -g set-titles-string '#S / #W · #h'

# Session environment is refreshed at attach, but route identity is computed
# separately for each actual client; SSH_CONNECTION is never a status label.
set -g update-environment 'DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM_PROGRAM TERM_PROGRAM_VERSION WEZTERM_PANE WEZTERM_UNIX_SOCKET COLORTERM TMUX_WORKSPACE_CLIENT_HOST'
set-hook -g client-attached[80] 'run-shell -b "test ! -x \"#{@workspace_config}/bin/tmux-workspace\" || \"#{@workspace_config}/bin/tmux-workspace\" client-update --client #{q:hook_client}"'
set-hook -g client-session-changed[80] 'run-shell -b "test ! -x \"#{@workspace_config}/bin/tmux-workspace\" || \"#{@workspace_config}/bin/tmux-workspace\" client-update --client #{q:hook_client}"'
set-hook -g client-detached[80] 'run-shell -b "test ! -x \"#{@workspace_config}/bin/tmux-workspace\" || \"#{@workspace_config}/bin/tmux-workspace\" client-remove --client #{q:hook_client} --tty #{q:hook_client}"'
