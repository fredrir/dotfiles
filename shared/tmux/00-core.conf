##### Terminal ###############################################################

# Prefer tmux's richer terminfo definition when the host has it.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' {
    set -g default-terminal "tmux-256color"
}

set -as terminal-features ",xterm-256color:RGB:usstyle"
set -as terminal-features ",wezterm:RGB:usstyle"

set -g allow-passthrough on

# Forward focus changes to applications such as Vim/Neovim.
set -g focus-events on

# Responsive Escape without making Meta/Alt unreliable.
set -s escape-time 10

##### Behaviour ##############################################################

set -g mouse on
set -g history-limit 100000
set -g display-time 2000

# Number windows/panes from 1.
set -g base-index 1
setw -g pane-base-index 1

# Close window 2 -> 3 becomes 2, etc.
set -g renumber-windows on

setw -g aggressive-resize on

# Keep the client alive when another detached tmux session exists.
set -g detach-on-destroy no-detached

set -s set-clipboard on
set -s get-clipboard request

##### Titles #################################################################

set -g set-titles on
set -g set-titles-string '#S:#I:#W'
