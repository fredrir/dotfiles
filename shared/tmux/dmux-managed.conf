# dmux managed tmux server configuration (plan §11.2). TEMPLATE:
# dmux starts managed servers with `tmux -L <ns> -f <generated conf>`,
# generating a concrete copy that replaces @DMUX@ with the absolute dmux
# binary path (and appends explicit --namespace/--data-dir/--lock-dir in
# test provisioning). This file is NOT sourced by the interactive tmux
# config: managed servers must not inherit ambient user config
# (ADR 004: base-index leakage broke index targeting).

# Markers require passthrough from invisible panes (ADR 005: `on` drops
# them silently; only `all` works) and OSC 2 titles for bootstrap
# correlation.
set-option -g allow-passthrough all
set-option -g allow-set-title on

# Epoch bootstrap on server birth: the first session-created event stamps
# @dmux_server_epoch and publishes the binding. Idempotent — later sessions
# find the epoch already bound. `ls` never runs this (plan §11.2).
set-hook -g session-created 'run-shell -b "@DMUX@ _tmux-bootstrap"'

# Keep the exact outer-GUI marker correlated after native tmux focus moves.
# `q:` shell-quotes each tmux-expanded field before run-shell sees it.  The
# hidden command is feature-gated, maps the client PID through its immutable
# attach-time process record (never a directory scan), and independently
# revalidates this complete tuple before and after writing to the exact tty.
# tmux 3.7b intentionally leaves hook_client empty for after-select and
# session-window-changed hooks; client_name remains scoped to the client
# that ran the select/move command. Hook failures never mutate markers and
# are silenced here so a stale/administrative client cannot spam its pane;
# direct test invocations opt into one bounded typed diagnostic.
set-hook -g client-attached 'run-shell -b "@DMUX@ _tmux-context-refresh --event=#{q:hook} --hook-client=#{q:hook_client} --client-name=#{q:client_name} --client-pid=#{q:client_pid} --client-tty=#{q:client_tty} --session-id=#{q:session_id} --window-id=#{q:window_id} --pane-id=#{q:pane_id} 2>/dev/null || :"'
set-hook -g client-session-changed 'run-shell -b "@DMUX@ _tmux-context-refresh --event=#{q:hook} --hook-client=#{q:hook_client} --client-name=#{q:client_name} --client-pid=#{q:client_pid} --client-tty=#{q:client_tty} --session-id=#{q:session_id} --window-id=#{q:window_id} --pane-id=#{q:pane_id} 2>/dev/null || :"'
set-hook -g client-active 'run-shell -b "@DMUX@ _tmux-context-refresh --event=#{q:hook} --hook-client=#{q:hook_client} --client-name=#{q:client_name} --client-pid=#{q:client_pid} --client-tty=#{q:client_tty} --session-id=#{q:session_id} --window-id=#{q:window_id} --pane-id=#{q:pane_id} 2>/dev/null || :"'
set-hook -g after-select-window 'run-shell -b "@DMUX@ _tmux-context-refresh --event=#{q:hook} --hook-client=#{q:hook_client} --client-name=#{q:client_name} --client-pid=#{q:client_pid} --client-tty=#{q:client_tty} --session-id=#{q:session_id} --window-id=#{q:window_id} --pane-id=#{q:pane_id} 2>/dev/null || :"'
set-hook -g after-select-pane 'run-shell -b "@DMUX@ _tmux-context-refresh --event=#{q:hook} --hook-client=#{q:hook_client} --client-name=#{q:client_name} --client-pid=#{q:client_pid} --client-tty=#{q:client_tty} --session-id=#{q:session_id} --window-id=#{q:window_id} --pane-id=#{q:pane_id} 2>/dev/null || :"'
set-hook -g session-window-changed 'run-shell -b "@DMUX@ _tmux-context-refresh --event=#{q:hook} --hook-client=#{q:hook_client} --client-name=#{q:client_name} --client-pid=#{q:client_pid} --client-tty=#{q:client_tty} --session-id=#{q:session_id} --window-id=#{q:window_id} --pane-id=#{q:pane_id} 2>/dev/null || :"'
