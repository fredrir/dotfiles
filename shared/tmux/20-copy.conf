##### Copy mode ##############################################################

setw -g mode-keys vi

bind Enter copy-mode

# vi-style selection; yank lands on the outside clipboard through
# set-clipboard external (00-core.conf), so it works over ssh too.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Mouse drag already copies on release via the default binding; keep the
# selection on screen instead of jumping to the bottom.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
