# The controller can override this option when validating in an isolated server.
# Required modules deliberately surface missing files and syntax errors.
set -gqo @workspace_config "$HOME/.config/tmux"

%if #{>=:#{version},3.3}
source-file -F '#{@workspace_config}/00-core.conf'
source-file -F '#{@workspace_config}/10-keys.conf'
source-file -F '#{@workspace_config}/20-copy.conf'
source-file -F '#{@workspace_config}/theme.conf'
source-file -F '#{@workspace_config}/30-ui.conf'
source-file -F '#{@workspace_config}/90-plugins.conf'

# Only this optional, machine-local module suppresses missing-file errors.
source-file -qF '#{@workspace_config}/local.conf'
%else
display-message 'Workspace requires tmux 3.3 or newer; upgrade tmux before loading this configuration.'
%endif
