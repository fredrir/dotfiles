##### Status line ############################################################

# Same chip grammar as the wezterm status bar (rounded caps, host chip in
# the archie accent), so a tmux session inside a wezterm tab reads as one
# system. bg=default inherits the terminal surface.

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=#9399b2"

set -g status-left-length 24
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=default] "

set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086] #I #[fg=#7f849c]#W "
set -g window-status-current-format "#[fg=#89b4fa,bold] #I #[fg=#cdd6f4,bold]#W "
set -g window-status-activity-style "fg=#f9e2af"
set -g window-status-bell-style "fg=#f38ba8"

set -g status-right-length 40
set -g status-right "#{?client_prefix,#[fg=#11111b]#[bg=#f38ba8]#[bold] PREFIX #[bg=default] ,}#[fg=#9399b2]%H:%M #[fg=#89b4fa,bg=default]#[fg=#11111b,bg=#89b4fa,bold] #h #[fg=#89b4fa,bg=default]"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#181825,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"