# One quiet line. All values are native formats or hook-cached metadata, so
# redraws never start a shell, inspect processes, read Git, or contact a host.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-style 'bg=#{@theme_bg},fg=#{@theme_muted}'
set -g status-left-length 60
set -g status-right-length 100
set -g window-status-separator ' '

# Host survives at narrow widths; session and connection detail collapse first.
set -g status-left '#[fg=#{@theme_on_primary},bg=#{@theme_primary},bold] #h #[default]#{?#{e|>=:#{client_width},75},#[fg=#{@theme_fg}] #{=24:session_name} #[fg=#{@theme_border}]│ , }'
set -g window-status-format '#[fg=#{@theme_muted}]#I #{=18:window_name}#{?window_zoomed_flag, ↗,} '
set -g window-status-current-format '#[fg=#{@theme_active_fg},bg=#{@theme_active_bg},bold] #I #{=24:window_name}#{?window_zoomed_flag, ↗,} #[default]'
set -g window-status-last-style 'fg=#{@theme_fg}'
set -g window-status-activity-style 'fg=#{@theme_muted}'
set -g window-status-bell-style 'fg=#{@theme_muted}'

# Modes are client-local. A resize or nested mode on one attachment must not
# claim that another attachment is in that mode too.
set -g @workspace_mode '#{?#{==:#{client_key_table},workspace-resize},RESIZE#{?#{e|>=:#{client_width},110},  hjkl · HJKL · = · Esc,},#{?#{m:workspace-nested*,#{client_key_table}},INNER#{?#{e|>=:#{client_width},110},  C-b Esc returns,},#{?client_prefix,PREFIX,#{?pane_in_mode,COPY,}}}}'
set -g status-right '#{?synchronize-panes,#[fg=#{@theme_on_primary}#,bg=#{@theme_error}#,bold] SYNC #[default] ,}#{?window_zoomed_flag,#[fg=#{@theme_primary}]ZOOM ,}#{?#{E:@workspace_mode},#[fg=#{@theme_on_primary}#,bg=#{@theme_primary}#,bold] #{E:@workspace_mode} #[default] ,}#{?#{e|>=:#{client_width},110},#[fg=#{@theme_muted}]#{E:@workspace-client-label} ,}#{?#{e|>=:#{client_width},140},#[fg=#{@theme_muted}]%H:%M ,}#{?#{==:#{@workspace-plugins-state},installing},#[fg=#{@theme_warning}]PLUGINS… ,}#{?#{==:#{@workspace-plugins-state},error},#[fg=#{@theme_error}]PLUGINS! ,}'

setw -g pane-border-status top
setw -g pane-border-format '#[fg=#{@theme_muted}] #{pane_index} #{?#{==:#{@workspace-tool},scratch-view},scratch,#{pane_current_command}} #{?pane_in_mode,· COPY ,}#{?synchronize-panes,· SYNC ,}#{?pane_marked,· MARKED ,}'
setw -g pane-border-lines single
