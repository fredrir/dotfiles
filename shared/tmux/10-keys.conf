# The portable vocabulary is also the target of the WezTerm adapter.
bind -N 'Forward prefix to the application or nested tmux' C-b send-prefix
bind -N 'Reload and validate workspace configuration' r run-shell -b '"#{@workspace_config}/bin/tmux-workspace" reload --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Detach this client; keep work running' D detach-client

unbind -q '"'
unbind -q %
bind -N 'Split right in the current directory' d split-window -h -c '#{pane_current_path}'
bind -N 'Split right in the current directory' | split-window -h -c '#{pane_current_path}'
bind -N 'Split below in the current directory' "'" split-window -v -c '#{pane_current_path}'
bind -N 'Split below in the current directory' - split-window -v -c '#{pane_current_path}'

# Navigation is one-shot: text typed immediately afterward reaches the shell.
bind -N 'Focus left through editor splits and tmux panes' h if-shell -F '#{@pane-is-vim}' 'send-keys C-h' 'select-pane -L'
bind -N 'Focus below through editor splits and tmux panes' j if-shell -F '#{@pane-is-vim}' 'send-keys C-j' 'select-pane -D'
bind -N 'Focus above through editor splits and tmux panes' k if-shell -F '#{@pane-is-vim}' 'send-keys C-k' 'select-pane -U'
bind -N 'Focus right through editor splits and tmux panes' l if-shell -F '#{@pane-is-vim}' 'send-keys C-l' 'select-pane -R'
bind -N 'Focus previous pane' ';' last-pane
bind -N 'Choose a pane' e display-panes
bind -N 'Zoom or unzoom current pane' z resize-pane -Z
bind -N 'Promote a chosen pane to the first position' m display-panes 'swap-pane -s "%%" -t "{top-left}"'
bind -N 'Promote current pane to the first position' M swap-pane -t '{top-left}'
bind -N 'Close pane with running-job protection' q run-shell -b '"#{@workspace_config}/bin/tmux-workspace" close-pane --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Close window with running-job protection' w run-shell -b '"#{@workspace_config}/bin/tmux-workspace" close-window --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Close pane with running-job protection' x run-shell -b '"#{@workspace_config}/bin/tmux-workspace" close-pane --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Close window with running-job protection' '&' run-shell -b '"#{@workspace_config}/bin/tmux-workspace" close-window --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Toggle synchronized input for this window' Y set-window-option synchronize-panes \; display-message 'Synchronized input: #{?synchronize-panes,ON,off}'

# Repetition is explicit and visible, so resize mode cannot eat ordinary text.
bind -N 'Enter resize mode: hjkl adjust, Escape finishes' R switch-client -T workspace-resize
bind -r -N 'Resize pane left' H resize-pane -L 3
bind -r -N 'Resize pane down' J resize-pane -D 3
bind -r -N 'Resize pane up' K resize-pane -U 3
bind -r -N 'Resize pane right' L resize-pane -R 3
bind -T workspace-resize -N 'Resize left' h resize-pane -L 2 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Resize down' j resize-pane -D 2 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Resize up' k resize-pane -U 2 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Resize right' l resize-pane -R 2 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Resize left quickly' H resize-pane -L 8 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Resize down quickly' J resize-pane -D 8 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Resize up quickly' K resize-pane -U 8 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Resize right quickly' L resize-pane -R 8 \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Balance pane sizes' = select-layout -E \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Cycle layout' Space next-layout \; switch-client -T workspace-resize
bind -T workspace-resize -N 'Finish resizing' Escape switch-client -T root
bind -T workspace-resize -N 'Finish resizing' Enter switch-client -T root
bind -T workspace-resize Any switch-client -T root \; send-keys

bind -N 'New window in the current directory' t new-window -c '#{pane_current_path}'
bind -N 'New window in the current directory' c new-window -c '#{pane_current_path}'
bind -N 'Next window' n next-window
bind -N 'Previous window' p previous-window
bind -N 'Last active window' Tab last-window
bind -N 'Last numbered window' 0 select-window -t ':$'

bind -N 'Find projects, worktrees and running sessions' s run-shell -b '"#{@workspace_config}/bin/tmux-workspace" projects --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Search workspace actions' Space run-shell -b '"#{@workspace_config}/bin/tmux-workspace" palette --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Search bindings and their descriptions' ? run-shell -b '"#{@workspace_config}/bin/tmux-workspace" help --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Park current pane on the shelf' S run-shell -b '"#{@workspace_config}/bin/tmux-workspace" shelf-park --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Retrieve a pane from the shelf' . run-shell -b '"#{@workspace_config}/bin/tmux-workspace" shelf --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Toggle persistent scratch drawer' '`' run-shell -b '"#{@workspace_config}/bin/tmux-workspace" scratch --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Open a native floating scratch pane when supported' '*' run-shell -b '"#{@workspace_config}/bin/tmux-workspace" scratch --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Open Lazygit for the current project' g run-shell -b '"#{@workspace_config}/bin/tmux-workspace" lazygit --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Open Yazi for the current directory' y run-shell -b '"#{@workspace_config}/bin/tmux-workspace" yazi --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Choose or resume an agent conversation' a run-shell -b '"#{@workspace_config}/bin/tmux-workspace" agent --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Move agent execution to another machine' A run-shell -b '"#{@workspace_config}/bin/tmux-workspace" handoff --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Switch to a workspace on another host' F7 run-shell -b '"#{@workspace_config}/bin/tmux-workspace" host --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Quick-select a path, URL or token' f run-shell -b '"#{@workspace_config}/bin/tmux-workspace" quick-select --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Search command output and deeper scrollback' O run-shell -b '"#{@workspace_config}/bin/tmux-workspace" output --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Inspect key routing and terminal capabilities' I run-shell -b '"#{@workspace_config}/bin/tmux-workspace" inspect --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Save workspace recovery snapshot' C-s run-shell -b '"#{@workspace_config}/bin/tmux-workspace" save --pane #{q:pane_id} --client #{q:client_name}'
bind -N 'Restore workspace recovery snapshot' C-r run-shell -b '"#{@workspace_config}/bin/tmux-workspace" restore --pane #{q:pane_id} --client #{q:client_name}'

# Nested forwarding belongs to the individual client, not the whole session.
# Ctrl-b Escape returns locally; ordinary Escape continues to reach the inner UI.
bind -N 'Forward keys to nested tmux; Ctrl-b Escape returns' B switch-client -T workspace-nested
bind -T workspace-nested C-b switch-client -T workspace-nested-prefix
bind -T workspace-nested Any send-keys \; switch-client -T workspace-nested
bind -T workspace-nested-prefix Escape switch-client -T root
bind -T workspace-nested-prefix Any send-prefix \; send-keys \; switch-client -T workspace-nested
