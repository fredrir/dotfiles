[app]
overall = { bg = "bg" }

[mgr]
cwd = { fg = "fg" }

find_keyword  = { fg = "contrast(yellow)", bg = "yellow", italic = true }
find_position = { fg = "bright_yellow", bg = "reset", italic = true }

marker_copied   = { fg = "cyan", bg = "cyan" }
marker_cut      = { fg = "magenta", bg = "magenta" }
marker_marked   = { fg = "bright_yellow", bg = "bright_yellow" }
marker_selected = { fg = "yellow", bg = "yellow" }

count_copied   = { fg = "contrast(cyan)", bg = "cyan" }
count_cut      = { fg = "contrast(magenta)", bg = "magenta" }
count_selected = { fg = "contrast(yellow)", bg = "yellow" }

border_symbol = " "
border_style  = { fg = "primary" }
syntect_theme = ""

[indicator]
parent  = { fg = "primary" }
current = { fg = "contrast(primary)", bg = "primary", bold = true }
preview = { fg = "primary" }
padding = { open = "█", close = "█" }

[tabs]
active    = { fg = "contrast(primary)", bg = "primary", bold = true, italic = true, underline = true }
inactive  = { fg = "fg", bg = "sunken", bold = false, underline = true }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "contrast(primary)", bg = "primary", bold = true }
normal_alt  = { fg = "muted", bg = "panel" }
select_main = { fg = "contrast(bright_yellow)", bg = "bright_yellow", bold = true }
select_alt  = { fg = "muted", bg = "panel" }
unset_main  = { fg = "contrast(green)", bg = "green", bold = true }
unset_alt   = { fg = "muted", bg = "panel" }

[status]
overall   = { fg = "muted", bg = "sunken" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "fg", bold = true }
progress_normal = { fg = "border", bg = "panel" }
progress_error  = { fg = "red", bg = "panel" }

perm_type  = { fg = "muted" }
perm_read  = { fg = "blue" }
perm_write = { fg = "green" }
perm_exec  = { fg = "red" }
perm_sep   = { fg = "muted" }

[pick]
border   = { fg = "primary" }
active   = { fg = "primary", bold = true }
inactive = {}

[input]
border   = { fg = "primary" }
title    = {}
value    = {}
selected = { reversed = true }

[tasks]
border  = { fg = "primary" }
title   = {}
hovered = { underline = true }

[which]
cols            = 3
mask            = { bg = "panel" }
cand            = { fg = "primary" }
rest            = { fg = "disabled" }
desc            = { fg = "bright_yellow" }
separator       = "  "
separator_style = { fg = "primary" }

[help]
on      = { fg = "primary" }
run     = { fg = "primary" }
desc    = { fg = "disabled" }
hovered = { reversed = true, bold = true }
footer  = { fg = "panel", bg = "muted" }

[notify]
title_info  = { fg = "primary" }
title_warn  = { fg = "fg" }
title_error = { fg = "red" }

[confirm]
border     = { fg = "primary" }
title      = { fg = "primary" }
body       = { fg = "fg" }
list       = { fg = "fg" }
btn_yes    = { reversed = true, fg = "primary" }
btn_no     = {}
btn_labels = ["  [Y]es  ", "  (N)o  "]

[filetype]
rules = [
  { mime = "image/*", fg = "magenta" },
  { mime = "{audio,video}/*", fg = "yellow" },
  { mime = "application/*zip", fg = "red" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "red" },
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "cyan" },
  { url = "*/", fg = "primary" },
  { url = "*", fg = "fg" },
]

[spot]
border   = { fg = "primary" }
title    = { fg = "primary" }
tbl_col  = { fg = "primary", bold = true }
tbl_cell = { fg = "fg" }

[cmp]
border       = { fg = "primary" }
active       = { reversed = true, fg = "primary" }
inactive     = { fg = "fg" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[icon]
dirs = []
prepend_conds = [{ if = "dir", text = "", fg = "primary" }]
prepend_dirs = [
  { name = "Desktop", text = "", fg = "primary" },
  { name = "Downloads", text = "", fg = "primary" },
  { name = "Documents", text = "", fg = "primary" },
  { name = "Music", text = "", fg = "primary" },
  { name = "Pictures", text = "", fg = "primary" },
  { name = "Videos", text = "", fg = "primary" },
  { name = "Books", text = "", fg = "primary" },
  { name = "Arch-dotfiles", text = "", fg = "primary" },
  { name = "Project", text = "", fg = "primary" },
]
