# DHCP only -- do not run a DNS server.
port=0

# Only the Mac USB-NCM interface.
interface=macie0
bind-dynamic

# Arch is 10.77.77.2/30; lease the only other host address to Mac.
dhcp-range=10.77.77.1,10.77.77.1,255.255.255.252,12h

# Deliberately advertise neither a router nor DNS server.
dhcp-option=option:router
dhcp-option=option:dns-server

# Keep this instance separate from any libvirt dnsmasq instance.
pid-file=/run/macie-usb-dnsmasq.pid
dhcp-leasefile=/run/macie-usb-dnsmasq.leases

log-dhcp
