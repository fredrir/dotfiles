keypress_delay_ms: 20
keymap:
  - name: Literal backtick
    remap:
      Shift-Equal: [Shift-Equal, Space]
  - name: Konsole clean copy and interrupt
    application:
      only: /(?i)^org\.kde\.konsole$/
    exact_match: true
    remap:
      Ctrl-C: Ctrl-Shift-C
      Ctrl-X: Ctrl-C
      Ctrl-Shift-C:
        - Ctrl-Shift-C
        - sleep: 200
        - launch: ["/bin/sh", "-c", "$HOME/.local/bin/clean-copy"]
      Ctrl-Alt-C:
        - Ctrl-Shift-C
        - sleep: 200
        - launch: ["/bin/sh", "-c", "$HOME/.local/bin/clean-copy && $HOME/.local/bin/transcript capture --quiet"]
  - name: kitty copy and interrupt
    application:
      only: /(?i)^kitty$/
    exact_match: true
    remap:
      Ctrl-C: Ctrl-Shift-C
      Ctrl-X: Ctrl-C
      Ctrl-Alt-C:
        - Ctrl-Shift-C
        - sleep: 200
        - launch: ["/bin/sh", "-c", "$HOME/.local/bin/clean-copy && $HOME/.local/bin/transcript capture --quiet"]
  - name: wezterm copy and interrupt
    application:
      only: /(?i)^(org\.wezfurlong\.wezterm|wezterm(-gui)?)$/
    exact_match: true
    remap:
      Ctrl-C: Ctrl-Shift-C
      Ctrl-X: Ctrl-C
      Ctrl-Alt-C:
        - Ctrl-Shift-C
        - sleep: 200
        - launch: ["/bin/sh", "-c", "$HOME/.local/bin/clean-copy && $HOME/.local/bin/transcript capture --quiet"]
  - name: Global agent capture
    remap:
      Ctrl-Alt-C:
        - launch: ["/bin/sh", "-c", "wl-paste --no-newline -t text > \"${XDG_RUNTIME_DIR:-/tmp}/transcript-clip\" 2>/dev/null || true"]
        - sleep: 150
        - Ctrl-C
        - sleep: 250
        - launch: ["/bin/sh", "-c", "$HOME/.local/bin/clean-copy && $HOME/.local/bin/transcript capture --quiet --fallback \"${XDG_RUNTIME_DIR:-/tmp}/transcript-clip\""]
