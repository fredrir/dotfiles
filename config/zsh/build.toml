output = ".cache/zsh/build"

# Read from the build environment; their runtime values are assumed to match
ambient = [
  "HOME",
  "USER",
  "HOMEBREW_PREFIX",
  "XDG_CACHE_HOME",
  "XDG_CONFIG_HOME",
  "XDG_DATA_HOME",
  "ZSH_CUSTOM",
  "ZSH_CACHE_DIR",
  "ZSH_COMPDUMP",
  "ZOXIDE_CMD_OVERRIDE",
]

[[target]]
name    = "zshrc"
source  = "shared/zsh/01-init.zsh"
env     = ["shared/zsh/00-global.zsh"]
profile = "shared/zsh/00-profile.zsh"
system  = true

# Global startup files; compiled in, and skipped by zsh, only when all of them compile
[system]
ambient = ["HOME", "USER"]

# Run after the first prompt in their original order; in place when no prompt follows
[defer]
compinit = true
plugins = [
  "archlinux",
  "bun",
  "colored-man-pages",
  "copyfile",
  "copypath",
  "docker",
  "docker-compose",
  "gh",
  "gitignore",
  "helm",
  "kubectl",
  "macos",
  "npm",
  "postgres",
]
files = ["shared/zsh/70-completions.zsh"]

# Output fixed between builds; folded at build time
[fold]
commands = [
  "brew --prefix",
  "brew shellenv zsh",
  "git version",
  "fzf --version",
  "fzf --zsh",
  "zoxide init --cmd z zsh",
]
