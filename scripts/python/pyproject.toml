[project]
name            = "tools"
version         = "0.1.0"
description     = "Workstation command-line tools for this dotfiles repository"
requires-python = ">=3.12"
dependencies    = ["typer>=0.15", "rich>=13", "tomlkit>=0.13"]

[project.scripts]
tardirs                 = "tools.utils.tardirs:app"
sysinfo                 = "tools.utils.sysinfo:app"
power-menu              = "tools.desktop.power_menu:app"
confirm-exit            = "tools.desktop.confirm_exit:app"
clean-copy              = "tools.desktop.clean_copy:app"
cpa                     = "tools.utils.remote_clipboard:cpa_app"
cpas                    = "tools.utils.remote_clipboard:cpas_app"
acp                     = "tools.utils.remote_clipboard:acp_app"
transcript              = "tools.transcript.cli:app"
update-readme-fastfetch = "tools.readme.fastfetch:app"
dotfile                 = "tools.dotfile.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires      = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"src/tools/readme/fastfetch.py" = ["BLE001"]
# A completion that raises would print a traceback into the line being typed,
# and a tool this machine cannot import simply has no completions.
"src/tools/surface/values.py" = ["BLE001"]
"src/tools/surface/entry.py"  = ["BLE001", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]