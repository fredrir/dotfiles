[project]
name            = "tools"
version         = "0.1.0"
description     = "Workstation command-line tools for this dotfiles repository"
requires-python = ">=3.12"
dependencies    = ["typer>=0.15", "rich>=13", "tomlkit>=0.13"]

[project.scripts]
transcript = "tools.transcript.cli:app"

[dependency-groups]
dev = ["pexpect>=4.9.0", "pytest>=8", "pytest-xdist>=3.8,<4", "ruff>=0.8"]

[build-system]
requires      = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
cache-dir   = "~/.cache/ruff"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
cache_dir = "$HOME/.cache/pytest/dotfiles"
testpaths = ["tests"]