[package]
name              = "workstation-sysinfo"
version.workspace = true
description       = "Native system inventory and health"
edition.workspace = true
license.workspace = true
autotests         = false

[lints]
workspace = true

# Startup-bound: fat LTO's smaller binary starts measurably faster.
[package.metadata.dotfile]
profile = "release"

[[bin]]
name = "sysinfo"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[dependencies]
ui-theme.workspace = true
ui-terminal.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
hostkit.workspace = true
workstation.workspace = true
tempfile.workspace = true
unicode-width.workspace = true
rustix = { workspace = true, features = ["system"] }
sysinfo_backend = { package = "sysinfo", version = "0.37", default-features = false, features = [
  "system",
  "disk",
] }
regex = "1"
csv = "1"

[dev-dependencies]
testkit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys      = "0.4"
libc.workspace  = true
sysctl          = "0.7.1"