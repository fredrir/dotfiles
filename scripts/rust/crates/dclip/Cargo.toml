[package]
name              = "dclip"
version.workspace = true
description       = "One clipboard across macie, archie and the mux panes between them"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Startup-bound: fat LTO's smaller binary starts measurably faster.
[package.metadata.dotfile]
profile = "release"

[dependencies]
base64                = "0.23.1"
clap.workspace        = true
hostkit.workspace     = true
nix                   = { workspace = true, features = ["user"] }
rustls                = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
workstation.workspace = true
x509-cert             = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.4"

[dev-dependencies]
tempfile.workspace = true
testkit.workspace  = true
