[package]
name              = "hexcat"
version.workspace = true
description       = "cat with bat highlighting and color swatches"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Aliased to `cat`: fat LTO scans and highlights about a fifth faster.
[package.metadata.dotfile]
profile = "release"

[dependencies]
bat                   = { version = "0.26.1", default-features = false, features = ["regex-onig"] }
clap.workspace        = true
csscolorparser        = { version = "0.9.0", default-features = false, features = ["std"] }
memchr                = "2.8.3"
regex                 = "1.13.1"
rustc-hash            = "2.1.3"
vte                   = "0.15.0"
workstation.workspace = true

[dev-dependencies]
testkit.workspace = true
