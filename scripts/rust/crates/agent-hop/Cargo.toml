[package]
name              = "agent-hop"
version.workspace = true
description       = "Continue Codex and Claude Code sessions on the other workstation"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace          = true
crossterm.workspace     = true
hostkit.workspace       = true
ratatui                 = { workspace = true, features = ["unstable-rendered-line-info"] }
serde.workspace         = true
serde_json              = { workspace = true, features = ["preserve_order"] }
sha2.workspace          = true
tempfile.workspace      = true
tungstenite             = { version = "0.28", default-features = false, features = ["handshake"] }
tui-kit.workspace       = true
unicode-width.workspace = true
workstation.workspace   = true

[dev-dependencies]
testkit.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
