[package]
name              = "hcopy"
version.workspace = true
description       = "Copy a path between the same home-relative place on macie and archie"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "hpush"
path = "src/bin/hpush.rs"

