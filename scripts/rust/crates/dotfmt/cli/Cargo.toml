[package]
name              = "dotfmt"
version.workspace = true
description       = "Unified configurable formatter for config, JSON, LaTeX, Lua, Markdown, TOML, YAML, TypeScript, JavaScript, CSS, HTML and Tailwind"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace        = true
workstation           = { workspace = true, features = ["walk"] }
dotfmt-core.workspace = true
ignore.workspace      = true
rayon.workspace       = true
dotfmt-bib            = { path = "../languages/bib" }
dotfmt-conf           = { path = "../languages/conf" }
dotfmt-env            = { path = "../languages/env" }
dotfmt-ignore         = { path = "../languages/ignore" }
dotfmt-ini            = { path = "../languages/ini" }
dotfmt-json           = { path = "../languages/json" }
dotfmt-latex          = { path = "../languages/latex" }
dotfmt-lua            = { path = "../languages/lua" }
dotfmt-markdown       = { path = "../languages/markdown" }
dotfmt-plist          = { path = "../languages/plist" }
dotfmt-toml           = { path = "../languages/toml" }
dotfmt-yaml           = { path = "../languages/yaml" }
dotfmt-typescript     = { path = "../languages/typescript" }
dotfmt-css            = { path = "../languages/css" }
dotfmt-html           = { path = "../languages/html" }
dotfmt-tailwind       = { path = "../tailwind" }
serde.workspace       = true
serde_json.workspace  = true
similar.workspace     = true

[dev-dependencies]
testkit.workspace  = true
tempfile.workspace = true