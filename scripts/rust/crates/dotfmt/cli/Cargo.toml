[package]
name              = "dotfmt"
version.workspace = true
description       = "Unified configurable formatter for configuration files, JSON, Lua, and Markdown"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap.workspace = true
workstation = { workspace = true, features = ["walk"] }
dotfmt-core.workspace = true
rayon.workspace = true
dotfmt-conf = { path = "../languages/conf" }
dotfmt-json = { path = "../languages/json" }
dotfmt-lua = { path = "../languages/lua" }
dotfmt-markdown = { path = "../languages/markdown" }

[dev-dependencies]
testkit.workspace  = true
tempfile.workspace = true
