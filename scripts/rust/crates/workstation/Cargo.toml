[package]
name              = "workstation"
version.workspace = true
description       = "Shared command-line plumbing for the workstation tools"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
walk = ["dep:rayon"]

[dependencies]
ui-cli.workspace        = true
ui-theme                = { workspace = true, features = ["clap"] }
ui-terminal.workspace   = true
serde.workspace         = true
serde_json.workspace    = true
clap.workspace          = true
clap_complete.workspace = true
rayon                   = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
testkit.workspace  = true