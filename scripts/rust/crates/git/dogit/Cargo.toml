[package]
name              = "dogit"
version.workspace = true
edition.workspace = true
license.workspace = true
description       = "A deliberate, responsive Git workbench"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
clap.workspace = true
crossterm = { workspace = true, features = ["osc52"] }
crossbeam-channel.workspace = true
ratatui.workspace = true
ratatui-image = { version = "=10.0.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex = "2.0.1"
syntect = { version = "5.3.0", default-features = false, features = [
 "default-syntaxes",
 "default-themes",
 "regex-fancy",
] }
tempfile.workspace = true
ui-terminal = { workspace = true, features = ["ratatui"] }
ui-theme = { workspace = true, features = ["ratatui"] }
ui-widgets.workspace = true
ui-progress.workspace = true
hostkit.workspace = true
workstation.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
