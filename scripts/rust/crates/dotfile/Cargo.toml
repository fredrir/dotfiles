[package]
name              = "dotfile-cli"
version.workspace = true
description       = "Reconcile the dotfiles repository with this workstation"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "dotfile"
path = "src/main.rs"

[dependencies]
ui-cli.workspace = true
ui-theme = { workspace = true, features = ["ratatui"] }
ui-widgets.workspace = true
ui-progress = { workspace = true, features = ["ratatui"] }
ui-diff-view.workspace = true
ui-gallery.workspace = true
clap.workspace = true
clap_complete.workspace = true
regex = "1"
zeroize = "1"
aho-corasick = "1"
serde_yaml_ng = "0.10"
globset = "0.4"
crossbeam-channel.workspace = true
crossterm.workspace = true
similar.workspace = true
unicode-width.workspace = true
tree-sitter = "0.25"
tree-sitter-lua = "0.5"
hostkit.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tachyonfx.workspace = true
tempfile.workspace = true
toml = { version = "0.9", default-features = false, features = [
  "parse",
  "serde",
  "std",
  "preserve_order",
] }
ui-terminal = { workspace = true, features = ["ratatui"] }
workstation.workspace = true

sysinfo = { package = "workstation-sysinfo", path = "../sysinfo" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix            = { workspace = true, features = ["signal", "process", "fs", "term", "user", "poll"] }

[dev-dependencies]
tempfile.workspace = true
testkit.workspace  = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["termios"] }