[package]
name              = "dotfile-cli"
version.workspace = true
description       = "Reconcile the dotfiles repository with this workstation"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "dotfile"
path = "src/main.rs"

[dependencies]
clap.workspace              = true
crossbeam-channel.workspace = true
crossterm.workspace         = true
doc-keybinds                = { path = "../doc-keybinds" }
hostkit.workspace           = true
ratatui.workspace           = true
serde.workspace             = true
serde_json                  = { workspace = true, features = ["preserve_order"] }
sha2.workspace              = true
tachyonfx.workspace         = true
tempfile.workspace          = true
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tui-kit.workspace           = true
workstation.workspace       = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
tempfile.workspace = true
testkit.workspace  = true
