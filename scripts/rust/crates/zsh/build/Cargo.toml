[package]
name              = "zsh-build"
version.workspace = true
description       = "Compiles the zsh startup config into one optimized bundle"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "zsh_build"

[[bin]]
name = "zsh-build"
path = "src/main.rs"

[dependencies]
clap.workspace        = true
hostkit.workspace     = true
nix                   = { workspace = true, features = ["fs", "hostname", "poll"] }
serde.workspace       = true
serde_json.workspace  = true
similar.workspace     = true
tempfile.workspace    = true
workstation.workspace = true

glob        = "0.3.4"
pty-process = "0.5.3"
toml        = "1.1.8"
zshrs-parse = "0.10.9"

[dev-dependencies]
testkit.workspace = true
