[workspace]
resolver = "2"
# Listed rather than globbed: every path a glob matches has to be a package,
# and `crates/git` is a folder of them.
members = [
  "crates/agent-hop",
  "crates/bench-workloads",
  "crates/count",
  "crates/doc-purge",
  "crates/dotfile",
  "crates/dotfile-format",
  "crates/dotfmt",
  "crates/file-explorer",
  "crates/flatten",
  "crates/git/gdd",
  "crates/git/gget",
  "crates/git/gitkit",
  "crates/git/gppf",
  "crates/hcopy",
  "crates/hostkit",
  "crates/hwire",
  "crates/mux-route",
  "crates/path",
  "crates/size",
  "crates/sysinfo-collect",
  "crates/workstation",
]

[workspace.package]
edition = "2024"
license = "MIT"

# Versions for anything more than one crate depends on
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossbeam-channel = "0.5"
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm_0_29",
  "scrolling-regions",
] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyonfx = { version = "0.25.1", default-features = false, features = ["std"] }
tempfile = "3"
workstation = { path = "crates/workstation" }
gitkit = { path = "crates/git/gitkit" }
hostkit = { path = "crates/hostkit" }
file-explorer = { path = "crates/file-explorer" }
unicode-width = "0.2"

gix-glob   = "0.27.1"
gix-ignore = "0.22.1"

# gitoxide, with only the parts the git tools use
gix = { version = "0.87.1", default-features = false, features = [
  "status",
  "worktree-mutation",
  "max-performance-safe",
  "auto-chain-error",
  "sha1",
] }

# One codegen unit and fat LTO, so a rebuild of the same source on the same
# toolchain produces the same machine code: these binaries are measurement
# instruments, and codegen variance would show up as a hardware regression.
[profile.release]
lto           = true
codegen-units = 1