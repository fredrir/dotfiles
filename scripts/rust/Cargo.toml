[workspace]
resolver = "2"
# Listed rather than globbed: every path a glob matches has to be a package,
# and `crates/git` is a folder of them.
members = [
  "crates/bench-workloads",
  "crates/dclip",
  "crates/dot-code/case",
  "crates/dot-code/core",
  "crates/dot-code/server",
  "crates/dot-code/typescript",
  "crates/dot-code/workspace",
  "crates/dotfile",
  "crates/dotfmt/cli",
  "crates/dotfmt/core",
  "crates/dotfmt/languages/bib",
  "crates/dotfmt/languages/conf",
  "crates/dotfmt/languages/env",
  "crates/dotfmt/languages/ignore",
  "crates/dotfmt/languages/ini",
  "crates/dotfmt/languages/json",
  "crates/dotfmt/languages/latex",
  "crates/dotfmt/languages/lua",
  "crates/dotfmt/languages/markdown",
  "crates/dotfmt/languages/plist",
  "crates/dotfmt/languages/toml",
  "crates/dotfmt/languages/yaml",
  "crates/dotfmt/languages/typescript",
  "crates/dotfmt/languages/css",
  "crates/dotfmt/languages/html",
  "crates/dotfmt/tailwind",
  "crates/dotfmt/lsp",
  "crates/git/gdd",
  "crates/git/dogit",
  "crates/git/gdelta",
  "crates/git/gget",
  "crates/git/gitkit",
  "crates/git/gppf",
  "crates/hcopy",
  "crates/hostkit",
  "crates/hport",
  "crates/hwire",
  "crates/hwtune",
  "crates/macos/dspell",
  "crates/macos/dwin",
  "crates/mux-route",
  "crates/op-bridge",
  "crates/sysinfo",
  "crates/testkit",
  "crates/ui/batch",
  "crates/ui/cli",
  "crates/ui/diff-view",
  "crates/ui/file-explorer",
  "crates/ui/gallery",
  "crates/ui/picker",
  "crates/ui/progress",
  "crates/ui/terminal",
  "crates/ui/theme",
  "crates/ui/widgets",
  "crates/utility/count",
  "crates/utility/doc-purge/cli",
  "crates/utility/doc-purge/core",
  "crates/utility/flatten",
  "crates/utility/hexcat",
  "crates/utility/path",
  "crates/utility/rm-emptydirs",
  "crates/utility/size",
  "crates/workstation",
  "crates/zsh/build",
  "crates/zsh/completions",
]

[workspace.package]
edition      = "2024"
license      = "MIT"
version      = "0.1.0"
publish      = false
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code            = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Versions for anything more than one crate depends on
[workspace.dependencies]
age                  = "0.12.1"
clap                 = { version = "4", features = ["derive"] }
clap_complete        = "4"
crossbeam-channel    = "0.5"
crossterm            = "0.29"
libc                 = "0.2"
nix                  = "0.30.1"
rustix               = "1.1.4"
ratatui              = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "scrolling-regions"] }
rayon                = "1"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
sha2                 = "0.10"
tachyonfx            = { version = "0.25.1", default-features = false, features = ["std"] }
tempfile             = "3"
workstation          = { path = "crates/workstation" }
dotfmt-core          = { path = "crates/dotfmt/core" }
dotfmt-typescript    = { path = "crates/dotfmt/languages/typescript" }
dotfmt-css           = { path = "crates/dotfmt/languages/css" }
dotfmt-html          = { path = "crates/dotfmt/languages/html" }
dotfmt-tailwind      = { path = "crates/dotfmt/tailwind" }
dotfmt-lsp           = { path = "crates/dotfmt/lsp" }
dot-code-case        = { path = "crates/dot-code/case" }
dot-code-core        = { path = "crates/dot-code/core" }
dot-code-typescript  = { path = "crates/dot-code/typescript" }
dot-code-workspace   = { path = "crates/dot-code/workspace" }
doc-purge-core       = { path = "crates/utility/doc-purge/core" }
gitkit               = { path = "crates/git/gitkit" }
hostkit              = { path = "crates/hostkit" }
testkit              = { path = "crates/testkit" }
ui-cli               = { path = "crates/ui/cli" }
ui-batch             = { path = "crates/ui/batch" }
ui-diff-view         = { path = "crates/ui/diff-view" }
ui-file-explorer     = { path = "crates/ui/file-explorer" }
ui-gallery           = { path = "crates/ui/gallery" }
ui-picker            = { path = "crates/ui/picker" }
ui-progress          = { path = "crates/ui/progress" }
ui-terminal          = { path = "crates/ui/terminal" }
ui-theme             = { path = "crates/ui/theme" }
ui-widgets           = { path = "crates/ui/widgets" }
zsh-build            = { path = "crates/zsh/build" }
unicode-width        = "0.2"
unicode-segmentation = "1.13"
similar              = "2"
thiserror            = "2"
anyhow               = "1"
ignore               = "0.4"
jsonc-parser         = "0.34"
line-index           = "0.1.2"
lsp-server           = "0.10"
lsp-types            = "0.97"
malva                = "0.16"
markup_fmt           = "0.27"
rustywind_core       = "0.7"
criterion            = "0.7"
proptest             = "1"
sysinfo_backend      = { package = "sysinfo", version = "0.39.6", default-features = false }

# Oxc is not published as a library; the formatter is pinned to the oxfmt 0.76
# release tag so formatting behaviour cannot drift under the workspace.
oxc_allocator       = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_ast             = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_ast_visit       = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_diagnostics     = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_formatter       = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4", features = ["detect_code_removal"] }
oxc_formatter_core  = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_parser          = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_semantic        = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_span            = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }
oxc_syntax          = { git = "https://github.com/oxc-project/oxc", rev = "f3fcdcc61b08e9880476279ba21a363967940fa4" }

gix-glob   = "0.27.1"
gix-ignore = "0.22.1"

# gitoxide, with only the parts the git tools use
gix = { version = "0.87.1", default-features = false, features = [
  "status",
  "worktree-mutation",
  "max-performance-safe",
  "auto-chain-error",
  "sha1",
] }

# One codegen unit and fat LTO, so a rebuild of the same source on the same
# toolchain produces the same machine code: these binaries are measurement
# instruments, and codegen variance would show up as a hardware regression.
[profile.release]
lto           = true
codegen-units = 1

# What `dotfile sync` installs; a crate opts back into `release` with `[package.metadata.dotfile]`.
[profile.commands]
inherits      = "release"
lto           = "off"
codegen-units = 256
incremental   = true