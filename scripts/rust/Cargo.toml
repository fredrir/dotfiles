[workspace]
resolver = "2"
# Listed rather than globbed: every path a glob matches has to be a package,
# and `crates/git` is a folder of them.
members = [
  "crates/bench-workloads",
  "crates/count",
  "crates/dmux",
  "crates/flatten",
  "crates/git/gdd",
  "crates/git/gitkit",
  "crates/git/gpp",
  "crates/path",
  "crates/size",
  "crates/sysinfo-collect",
  "crates/workstation",
]

[workspace.package]
edition = "2024"
license = "MIT"

# Versions for anything more than one crate depends on
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1.24", features = ["v4", "v7", "serde"] }
# Bundled so the registry never depends on a system SQLite; backup for the
# online-backup API the dmux registry contract requires (docs/adr/dmux).
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
unicode-width = "0.2"
workstation = { path = "crates/workstation" }
gitkit = { path = "crates/git/gitkit" }

# gitoxide, with only the parts the git tools use
gix = { version = "0.86", default-features = false, features = [
  "status",
  "worktree-mutation",
  "max-performance-safe",
  "auto-chain-error",
  "sha1",
] }

# One codegen unit and fat LTO, so a rebuild of the same source on the same
# toolchain produces the same machine code: these binaries are measurement
# instruments, and codegen variance would show up as a hardware regression.
[profile.release]
lto = true
codegen-units = 1
